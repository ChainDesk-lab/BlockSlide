<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="powerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="powerBolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/><stop offset="0.5" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="powerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0c4a6e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Circular background -->
  <circle cx="128" cy="128" r="110" fill="url(#powerBg)" filter="url(#powerShadow)"/>
  <!-- Inner ring -->
  <circle cx="128" cy="128" r="95" fill="none" stroke="#e0f2fe" stroke-opacity="0.6" stroke-width="8"/>
  <!-- Lightning bolt -->
  <path d="M128 40 L168 110 H140 L156 210 L88 140 H116 L108 50 Z" fill="url(#powerBolt)"/>
  <!-- Highlight glow -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#e0f2fe" stroke-opacity="0.3" stroke-width="2"/>
</svg>
