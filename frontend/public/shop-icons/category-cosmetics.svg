<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="cosmeticBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="sparkles" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cosmeticShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#6b21a8" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Circular background -->
  <circle cx="128" cy="128" r="110" fill="url(#cosmeticBg)" filter="url(#cosmeticShadow)"/>
  <!-- Inner ring -->
  <circle cx="128" cy="128" r="95" fill="none" stroke="#f3e8ff" stroke-opacity="0.6" stroke-width="8"/>
  <!-- Center large star -->
  <path d="M128 50 L145 105 L202 105 L160 145 L177 200 L128 160 L79 200 L96 145 L54 105 L111 105 Z" fill="url(#sparkles)"/>
  <!-- Top-left small sparkle -->
  <path d="M80 70 L86 85 L102 85 L91 94 L97 109 L80 100 L63 109 L69 94 L58 85 L74 85 Z" fill="#fef3c7" opacity="0.9"/>
  <!-- Top-right small sparkle -->
  <path d="M176 70 L182 85 L198 85 L187 94 L193 109 L176 100 L159 109 L165 94 L154 85 L170 85 Z" fill="#fef3c7" opacity="0.9"/>
  <!-- Highlight glow -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#f3e8ff" stroke-opacity="0.3" stroke-width="2"/>
</svg>
